<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151515">
<meta name="description" content="0xstousif - security engineer. Interactive terminal portfolio.">
<title>0xstousif | terminal</title>
<style>
:root{--bg:#151515;--ink:#e6e2d3;--soft:#8f8b7d;--line:#3a3935;--acc:#b9d6a3;--warn:#e0a96d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Mono","Courier New",monospace}
::selection{background:var(--ink);color:var(--bg)}
a{color:var(--acc)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 6vw;text-align:center;z-index:5;background:var(--bg)}
#gate h1{font-weight:400;font-size:clamp(22px,5vw,40px);letter-spacing:.3em}
#gate p{color:var(--soft)}
#gate form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input{background:none;border:0;border-bottom:1px solid var(--ink);color:var(--ink);font:inherit;padding:6px 4px;outline:none}
#nm{width:min(260px,70vw);text-align:center}
button{background:none;border:1px solid var(--ink);color:var(--ink);font:inherit;padding:6px 18px;cursor:pointer}
button:hover,button:focus-visible{background:var(--ink);color:var(--bg);outline:none}
#term{display:none;height:100%;flex-direction:column;max-width:900px;margin:0 auto;padding:0 5vw}
#bar{padding:14px 0;border-bottom:1px solid var(--line);color:var(--soft);font-size:13px;display:flex;justify-content:space-between}
#out{flex:1;overflow-y:auto;padding:18px 0;word-wrap:break-word}
#out>div{white-space:pre-wrap;margin-bottom:2px}
.m{color:var(--soft)}.k{color:var(--acc)}.w{color:var(--warn)}.h{font-size:1.15em;letter-spacing:.05em}
.row{display:flex;gap:10px;padding:10px 0}
.pr{white-space:nowrap;color:var(--acc)}
#in{flex:1;border:0;min-width:0}
#chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 16px}
#chips button{padding:2px 12px;font-size:13px;border-color:var(--line);color:var(--soft)}
#chips button:hover{color:var(--bg);border-color:var(--ink)}
.cur::after{content:"\2588";animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="gate">
  <h1>0xSTOUSIF</h1>
  <p>identify yourself, visitor.</p>
  <form id="gf">
    <input id="nm" maxlength="16" placeholder="your name" autocomplete="off" aria-label="Your name" autofocus>
    <button>[ enter ]</button>
  </form>
  <p style="font-size:12px">letters and numbers only. leave blank to enter as guest.</p>
</div>

<div id="term">
  <div id="bar"><span id="title"></span><span>type <b>help</b></span></div>
  <div id="out" aria-live="polite"></div>
  <div id="chips"></div>
  <form class="row" id="cf">
    <span class="pr" id="pr"></span>
    <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command">
  </form>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)},out=$("out"),inp=$("in"),user="guest",hist=[],hi=0;
var HOST="0xstousif";

/* ---------- content (edit here) ---------- */
var ME={
 about:["Hi, I'm Shaik Tousif, a security engineer interested in understanding systems from the inside out.",
  "I document what I learn across application security, offensive security, cloud, and the tools that make security work repeatable."],
 info:[["user","0xstousif"],["role","security engineer"],["status","learning in public"],["location","earth.local"],["mission","build. break. learn."]]
};
var XP=[
 ["NOW","Security Engineer // present","Working on secure systems, practical assessments, and better ways to find and fix security problems."],
 ["2025","Security learning lab // independent","Building labs, solving challenges, reading research, and turning experiments into notes."],
 ["2024","First commit // started sharing","Created this space to track the journey and make every lesson easier to revisit."]
];
var POSTS=[
 ["WEB","Reading an HTTP request","Small observations that make web security fundamentals easier to see.","#"],
 ["LINUX","My command-line field notes","The commands and habits I keep reaching for while investigating a system.","#"],
 ["LAB","Building a safe practice lab","A personal environment for learning without putting real systems at risk.","#"]
];
var LINKS={github:"https://github.com/0xstousif",email:"mailto:stousiif@gmail.com",linkedin:"https://www.linkedin.com/in/stousiif"};

/* ---------- output helpers ---------- */
function line(t,c){var d=document.createElement("div");if(c)d.className=c;d.textContent=t;out.appendChild(d);return d}
function link(label,href){var d=document.createElement("div"),a=document.createElement("a");a.textContent=label;a.href=href;if(href.indexOf("http")===0)a.target="_blank",a.rel="noopener";d.appendChild(a);out.appendChild(d)}
function gap(){line(" ")}
function bottom(){out.scrollTop=out.scrollHeight}

/* ---------- commands ---------- */
var C={
 help:function(){
  line("available commands","h");gap();
  [["whoami","who am i"],["xp","experience log"],["blogs","list writeups (blogs 1 to read one)"],["skills","what I work with"],["contact","ways to reach me"],["ls","list files"],["cat <file>","read a file"],["clear","clear the screen"],["exit","change your name"]].forEach(function(r){line("  "+r[0].padEnd(12)+r[1])});
  gap();line("tip: Tab autocompletes, arrow keys browse history. try poking around.","m")},
 whoami:function(){
  line("about_me","h");gap();ME.about.forEach(function(t){line(t);gap()});
  ME.info.forEach(function(r){line(r[0].padEnd(10)+":: "+r[1])});
  gap();line("next: type xp or blogs","m")},
 xp:function(){
  line("experience.log","h");gap();
  XP.forEach(function(x){line(x[0],"m");line(x[1],"k");line("  "+x[2]);gap()})},
 blogs:function(a){
  var n=parseInt(a[0],10);
  if(n>=1&&n<=POSTS.length){var p=POSTS[n-1];line("["+p[0]+"] "+p[1],"h");gap();line(p[2]);gap();line("full writeup coming soon.","w");if(p[3]!=="#")link("read online",p[3]);return}
  line("writeups/","h");gap();
  POSTS.forEach(function(p,i){line((i+1)+". ["+p[0]+"] "+p[1],"k");line("   "+p[2],"m")});
  gap();line("read one with: blogs 1","m")},
 skills:function(){
  line("skills.txt","h");gap();
  [["appsec","web, APIs, auth flows"],["offensive","labs, CTFs, assessments"],["cloud","configs, identity, exposure"],["tooling","scripts that make checks repeatable"]].forEach(function(r){line(r[0].padEnd(11)+"- "+r[1])});
  gap();line("(edit these in the file to match your real stack)","m")},
 contact:function(){
  line("connect.sh","h");gap();for(var k in LINKS)link("[ "+k+" ]  "+LINKS[k].replace("mailto:",""),LINKS[k])},
 ls:function(){line("about.txt   experience.log   writeups/   skills.txt   connect.sh","k")},
 cat:function(a){
  var m={"about.txt":"whoami","experience.log":"xp","skills.txt":"skills","connect.sh":"contact"};
  if(!a[0])return line("usage: cat <file>","w");
  var f=a[0].replace(/\/$/,"");
  if(m[f])return C[m[f]]([]);
  if(f==="writeups")return line("cat: writeups: Is a directory. try: blogs","w");
  line("cat: "+f.slice(0,40)+": No such file","w")},
 clear:function(){out.innerHTML=""},
 exit:function(){$("term").style.display="none";$("gate").style.display="flex";$("nm").value="";$("nm").focus()},
 sudo:function(){line(user+" is not in the sudoers file. This incident will be reported.","w")},
 date:function(){line(new Date().toString())},
 echo:function(a){line(a.join(" ").slice(0,200))},
 rm:function(){line("nice try, "+user+". the void is read-only.","w")},
 pwd:function(){line("/home/"+user)}
};
C.writeups=C.blogs;C.about=C.whoami;C.exp=C.xp;C.links=C.contact;C.help["?"]=1;

function run(raw){
  var cmd=raw.trim();
  var d=line(user+"@"+HOST+":~$ "+raw);d.className="m";
  if(!cmd)return;
  hist.push(cmd);hi=hist.length;
  var p=cmd.split(/\s+/),name=p[0].toLowerCase();
  if(Object.prototype.hasOwnProperty.call(C,name)&&typeof C[name]==="function")C[name](p.slice(1));
  else line(name.slice(0,40)+": command not found. type help.","w");
  gap();bottom();
}

/* ---------- boot ---------- */
function start(n){
  user=n||"guest";
  $("gate").style.display="none";$("term").style.display="flex";
  $("pr").textContent=user+"@"+HOST+":~$";
  $("title").textContent=user+"@"+HOST;
  document.title=user+"@"+HOST+" | terminal";
  out.innerHTML="";
  line("Welcome to the void, "+user+".","h");
  line("Security engineer. Curious mind. Breaking things to understand how they work.","m");
  gap();line("type help to see what you can do, or tap a shortcut below.");gap();
  var ch=$("chips");ch.innerHTML="";
  ["help","whoami","xp","blogs","skills","contact"].forEach(function(c){
    var b=document.createElement("button");b.type="button";b.textContent=c;
    b.onclick=function(){run(c);inp.focus()};ch.appendChild(b)});
  inp.focus();
}
$("gf").addEventListener("submit",function(e){
  e.preventDefault();
  var n=$("nm").value.toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,16);
  start(n);
});
$("cf").addEventListener("submit",function(e){e.preventDefault();var v=inp.value;inp.value="";run(v)});
inp.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"){e.preventDefault();if(hi>0)inp.value=hist[--hi]}
  else if(e.key==="ArrowDown"){e.preventDefault();inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,"")}
  else if(e.key==="Tab"){e.preventDefault();var v=inp.value.toLowerCase();if(!v)return;
    var m=Object.keys(C).filter(function(k){return k.indexOf(v)===0});if(m.length===1)inp.value=m[0]+" "}
  else if(e.ctrlKey&&e.key==="l"){e.preventDefault();C.clear()}
});
$("term").addEventListener("click",function(e){if(!window.getSelection().toString()&&e.target.tagName!=="A"&&e.target.tagName!=="BUTTON")inp.focus()});
})();
</script>
</body>
</html>
